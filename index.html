function selectJob(job) {
const data = plans[job];
if (!data) return;

document.getElementById('resultTitle').textContent = data.title;
document.getElementById('resultSubtitle').textContent = data.subtitle;
document.getElementById('resultCount').textContent = `${data.list.length} طرح مناسب برای شما پیدا شد`;

const container = document.getElementById('resultsContainer');
container.innerHTML = data.list.map(p => `
<div class="result-card">
<h3>${p.name}</h3>
<span class="type">${p.type}</span>
<p>${p.desc}</p>
<div class="features">
${p.features.map(f => '• ' + f).('<br>')}
</div>
<button onclick="alert('درخواست شما برای «${p.name}» ثبت شد.\\nکارشناس بانک مهر ایران به‌زودی با شما تماس می‌گیرد.')">درخواست این طرح</button>
</div>
`).join('');

document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
document.getElementById('result').classList.add('active');
document.getElementById('d1').classList.add('active');
document.getElementById('d2').classList.add('active');
}

function restart() {
document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
document.getElementById('step1').classList.add('active');
document.getElementById('d1').classList.add('active');
document.getElementById('d2').classList.remove('active');
}
</script>
